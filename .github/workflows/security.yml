name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Monday 04:17 UTC.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: rust
          build-mode: none
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:rust"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Pinned binary (the action's container tag v3.100.0 was not published).
      # --no-verification keeps candidate secrets on the runner.
      - name: Install TruffleHog v3.100.0
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/trufflehog.tgz https://github.com/trufflesecurity/trufflehog/releases/download/v3.100.0/trufflehog_3.100.0_linux_amd64.tar.gz
          echo "b2d85eba59865e98f45c9fc9f77d2c6d62df529fdd5755af121304ea5a7cecbb  /tmp/trufflehog.tgz" | sha256sum -c
          sudo tar -C /usr/local/bin -xzf /tmp/trufflehog.tgz trufflehog
          trufflehog --version
      # Current tree only. A full-history scan would also flag a now-removed
      # dummy URL in the first 0.2.4 commit; that history is left in place.
      - name: Scan the checkout
        run: >
          trufflehog filesystem "$GITHUB_WORKSPACE"
          --no-update --no-verification --fail --results=unverified,unknown
          --exclude-paths "$GITHUB_WORKSPACE/.github/trufflehog-exclude.txt"
