name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Monday 04:17 UTC.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Push and schedule: this commit. pull_request (including Dependabot):
          # the proposed head, so a missing merge commit does not fail checkout.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: rust
          build-mode: none
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:rust"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # Pinned binary. The TruffleHog action's container tag v3.100.0 was not
      # published (that failed the first Security run and Dependabot PRs).
      # --no-verification keeps candidate secrets on the runner.
      - name: Install TruffleHog v3.100.0
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/trufflehog.tgz https://github.com/trufflesecurity/trufflehog/releases/download/v3.100.0/trufflehog_3.100.0_linux_amd64.tar.gz
          echo "b2d85eba59865e98f45c9fc9f77d2c6d62df529fdd5755af121304ea5a7cecbb  /tmp/trufflehog.tgz" | sha256sum -c
          sudo tar -C /usr/local/bin -xzf /tmp/trufflehog.tgz trufflehog
          trufflehog --version
      # Scan the checked-out tree, not git history: a dummy URL in commit
      # 5a018f5 would otherwise fail a history scan. Excludes are written here
      # so the job does not depend on a file from the branch.
      - name: Scan the checkout
        run: |
          set -euo pipefail
          printf '%s\n' '\.git/' '(^|/)target/' > "$RUNNER_TEMP/trufflehog-exclude.txt"
          trufflehog filesystem "$GITHUB_WORKSPACE" \
            --no-update --no-verification --fail --results=unverified,unknown \
            --exclude-paths "$RUNNER_TEMP/trufflehog-exclude.txt"
