[workspace]
resolver = "2"
members = ["crates/zeroin-core", "crates/zeroin-app"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
authors = ["Rozan Abid <https://github.com/Lukecinate>"]
repository = "https://github.com/Lukecinate/zeroin"
rust-version = "1.95"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
